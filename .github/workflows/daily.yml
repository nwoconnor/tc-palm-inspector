name: Daily inspection check

on:
  schedule:
    # DBPR's extracts have refreshed at ~10:48 UTC on every day we have observed,
    # so this runs shortly after: 11:30 UTC = 07:30 EDT / 06:30 EST.
    # (06:00 ET exactly would land *before* the refresh and always be a day behind.)
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if DBPR's files are unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-inspections
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, ingest, alert, export
        id: daily
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM:        ${{ secrets.ALERT_FROM }}
          ALERT_TO:          ${{ secrets.ALERT_TO }}
          DASHBOARD_URL:     ${{ vars.DASHBOARD_URL }}
        run: |
          python3 daily.py --send ${{ inputs.force && '--force' || '' }}

      - name: Commit updated data
        if: steps.daily.outputs.changed == 'true'
        run: |
          git config user.name  "inspection-bot"
          git config user.email "inspection-bot@users.noreply.github.com"
          git add data/inspections.db public/data.json data/archive 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: DBPR refresh $(date -u +%Y-%m-%d)"
            git push
          fi
